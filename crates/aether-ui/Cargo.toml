[package]
name = "aether-ui"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
smithay-client-toolkit = {
    version = "0.21.1",
    default-features = false,
    features = ["calloop", "xkbcommon"]
}
vello = "0.11"
wgpu = {
    version = "30.0",
    default-features = false,
    features = ["glsl"]
}
wayland-client = "0.31.15"
wayland-backend = {
    version = "0.3.17",
    features = ["client_system"]
}
fontconfig = "0.11"
swash = "0.2.10"
zune-jpeg = "0.5.15"
png = "0.18.1"
resvg = { version = "0.48.1", default-features = false }

[lints.clippy]
# keep the zero-denominator guard explicit
manual_checked_ops = "allow"
